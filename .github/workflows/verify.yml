name: Verify prototype
on:
  push:
    branches: [main, "phase*/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m venv .venv && .venv/bin/pip install -r requirements-lock.txt && .venv/bin/pip install --no-build-isolation --no-deps -e .
      - run: .venv/bin/python -m pytest -q
      - run: .venv/bin/python -m lens_guard evaluate --output work/evaluation.json
      - run: .venv/bin/python scripts/compare-evaluation.py docs/evaluation.json work/evaluation.json
      - run: npm ci && npm run build && npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: web
